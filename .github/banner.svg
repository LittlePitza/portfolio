<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Luis Hernández, portfolio. I build the systems I operate.">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF4A1C" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FF4A1C" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Light stage, where the name lives -->
  <rect width="1200" height="420" fill="#ECECE9"/>
  <!-- Black curtain being pushed to the right -->
  <rect x="650" y="0" width="550" height="420" fill="#141414"/>
  <rect x="650" y="0" width="550" height="420" fill="url(#glow)"/>

  <!-- Chrome labels, like the site's fixed frame -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.2" fill="#141414" fill-opacity="0.55">
    <text x="48" y="44">PORTFOLIO / V1</text>
    <text x="48" y="60">QUERÉTARO, MX · 2026</text>
    <text x="330" y="44">WORKING FROM</text>
    <text x="330" y="60">UTC-6</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.2" fill="#ECECE9" fill-opacity="0.6">
    <text x="1152" y="44" text-anchor="end">SELECTED WORK</text>
    <text x="1152" y="60" text-anchor="end">01 / 06</text>
  </g>

  <!-- The name -->
  <g font-family="Georgia, 'Times New Roman', Times, serif" font-size="96" fill="#FF4A1C" letter-spacing="-2">
    <text x="44" y="160">LUIS</text>
    <text x="44" y="250" textLength="548" lengthAdjust="spacingAndGlyphs">HERNÁNDEZ</text>
  </g>
  <text x="48" y="304" font-family="Georgia, 'Times New Roman', Times, serif" font-size="24" fill="#141414">I build the systems I operate.</text>
  <text x="48" y="336" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.2" fill="#141414" fill-opacity="0.55">NEXT.JS 16 · TYPESCRIPT · TAILWIND V4 · GSAP · LENIS · VERCEL</text>

  <!-- Project cards fanned on the curtain -->
  <g filter="url(#shadow)">
    <g transform="translate(720 120) rotate(-14)">
      <rect width="180" height="130" rx="6" fill="#1FA37A"/>
      <rect x="16" y="16" width="148" height="98" rx="4" fill="#F6F6F3"/>
      <text x="26" y="40" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#141414" fill-opacity="0.6">ATTENDANCE</text>
      <text x="26" y="78" font-family="Georgia, serif" font-size="30" fill="#141414">345</text>
      <text x="26" y="98" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9" fill="#141414" fill-opacity="0.55">SQL ASSERTIONS</text>
    </g>
    <g transform="translate(880 90) rotate(-6)">
      <rect width="180" height="130" rx="6" fill="#2757FF"/>
      <rect x="16" y="16" width="148" height="98" rx="4" fill="#F6F6F3"/>
      <text x="26" y="40" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#141414" fill-opacity="0.6">MAINTENANCE</text>
      <text x="26" y="78" font-family="Georgia, serif" font-size="30" fill="#141414">5</text>
      <text x="26" y="98" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9" fill="#141414" fill-opacity="0.55">SITES · PWA</text>
    </g>
    <g transform="translate(1010 150) rotate(9)">
      <rect width="180" height="130" rx="6" fill="#8B3DFF"/>
      <rect x="16" y="16" width="148" height="98" rx="4" fill="#F6F6F3"/>
      <text x="26" y="40" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#141414" fill-opacity="0.6">MARKETPLACE</text>
      <text x="26" y="78" font-family="Georgia, serif" font-size="30" fill="#141414">100%</text>
      <text x="26" y="98" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9" fill="#141414" fill-opacity="0.55">PRICES SERVER-SIDE</text>
    </g>
    <g transform="translate(700 262) rotate(7)">
      <rect width="180" height="130" rx="6" fill="#0FA3B1"/>
      <rect x="16" y="16" width="148" height="98" rx="4" fill="#F6F6F3"/>
      <text x="26" y="40" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#141414" fill-opacity="0.6">MEETSCRIBE</text>
      <text x="26" y="78" font-family="Georgia, serif" font-size="30" fill="#141414">329</text>
      <text x="26" y="98" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9" fill="#141414" fill-opacity="0.55">TESTS · MIT</text>
    </g>
    <g transform="translate(870 250) rotate(-4)">
      <rect width="180" height="130" rx="6" fill="#E0245E"/>
      <rect x="16" y="16" width="148" height="98" rx="4" fill="#F6F6F3"/>
      <text x="26" y="40" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#141414" fill-opacity="0.6">PASSWORD VAULT</text>
      <text x="26" y="78" font-family="Georgia, serif" font-size="30" fill="#141414">216</text>
      <text x="26" y="98" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9" fill="#141414" fill-opacity="0.55">AES-256-GCM · SCRYPT</text>
    </g>
    <g transform="translate(800 168) rotate(2)">
      <rect width="200" height="144" rx="6" fill="#FF4A1C"/>
      <rect x="16" y="16" width="168" height="112" rx="4" fill="#F6F6F3"/>
      <text x="28" y="42" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#141414" fill-opacity="0.6">TI HUB</text>
      <text x="28" y="86" font-family="Georgia, serif" font-size="36" fill="#141414">160</text>
      <text x="28" y="108" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9" fill="#141414" fill-opacity="0.55">TESTS · 19 RLS POLICIES · 5-STAGE CI</text>
    </g>
  </g>

  <!-- The character, pushing the curtain -->
  <g transform="translate(538 252) scale(0.55)" fill="none" stroke="#141414" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78 190 L40 262 L18 262"/>
    <path d="M96 196 L118 258 L150 262"/>
    <path d="M8 262 H44 L40 274 H8 Z" fill="#141414" stroke="none"/>
    <path d="M116 262 H156 L152 274 H116 Z" fill="#141414" stroke="none"/>
    <path d="M70 120 L104 108 L120 190 L80 200 Z" fill="#FF4A1C"/>
    <g fill="#ECECE9" stroke="none">
      <circle cx="88" cy="132" r="3.5"/>
      <circle cx="104" cy="150" r="3.5"/>
      <circle cx="92" cy="172" r="3.5"/>
    </g>
    <path d="M104 118 L160 104 L200 112"/>
    <path d="M112 150 L166 132 L204 138"/>
    <circle cx="204" cy="112" r="7" fill="#ECECE9"/>
    <circle cx="208" cy="138" r="7" fill="#ECECE9"/>
    <path d="M92 110 L84 92"/>
    <circle cx="76" cy="70" r="26" fill="#ECECE9"/>
    <path d="M50 66 Q76 36 104 62 L106 70 L48 74 Z" fill="#141414" stroke="none"/>
    <path d="M100 66 L128 72" stroke-width="6"/>
    <circle cx="90" cy="76" r="2.5" fill="#141414" stroke="none"/>
    <path d="M94 88 Q90 92 86 90" stroke-width="3"/>
    <path d="M126 50 L134 40 M132 58 L142 54" stroke-width="3"/>
  </g>
</svg>
